# Netlify-konfiguration. Sajten är ren HTML/CSS/JS — inget bygge behövs.
[build]
  publish = "."
      [build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAYCuxxQoMwSZA2pl-EP3EC0DnEQaQi11w"

# Cacha statiska filer länge (filnamnen byts när innehållet byts)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Grundläggande säkerhetsheaders
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
